name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safe
          POSTGRES_PASSWORD: safe
          POSTGRES_DB: safe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safe" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://safe:safe@localhost:5432/safe_test
      TEST_DATABASE_URL: postgresql://safe:safe@localhost:5432/safe_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: migrations no banco de teste
        run: npm run db:deploy -w backend
      - name: testes
        run: npm test
      - name: cobertura do motor (≥ 80%)
        run: npm run test:coverage
      - name: npm audit
        run: npm audit --audit-level=high
