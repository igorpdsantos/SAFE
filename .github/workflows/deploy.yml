name: deploy

# Produção na Vercel a cada push na main, só depois do CI verde (T-01.11).
# Ordem: migrations no banco de produção → build (.vercel/output) → publicação → checagem.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Um deploy bloqueado na Vercel deixa o CLI esperando; sem limite, o job fica preso por 6 h.
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrations no banco de produção
        run: npm run db:deploy -w backend
        env:
          # Conexão direta (sem pooler): o migrate usa trava de sessão.
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
      - name: build para a Vercel
        run: npm run build:vercel
      - name: publicar
        run: npx --yes vercel@59.11.7 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: checagem pós-deploy
        # No domínio de produção: as URLs únicas de cada deploy ficam protegidas pela Vercel.
        run: |
          curl -fsS --retry 5 --retry-delay 5 "$PROD_URL/api/v1/health"
          curl -fsSI "$PROD_URL/" | grep -qi '^content-security-policy:'
        env:
          PROD_URL: ${{ vars.PROD_URL }}
