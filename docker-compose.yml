# Postgres e Redis para desenvolvimento (SPEC-01 §4.7).
# `api` e `web` são opcionais: `docker compose --profile app up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: safe
      POSTGRES_PASSWORD: safe
      POSTGRES_DB: safe
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safe']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    # Sem persistência: sessões somem ao reiniciar (SEGURANCA_LGPD §4).
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'

  api:
    profiles: ['app']
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run db:deploy -w backend && npm run dev -w backend"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://safe:safe@postgres:5432/safe
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    profiles: ['app']
    image: node:22
    working_dir: /app
    command: sh -c "npm run dev -w frontend -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:3000
    volumes:
      - .:/app
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  pgdata:
